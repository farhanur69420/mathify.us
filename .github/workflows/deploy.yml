# NOT the live deploy. www.mathify.us and mathify.us both resolve to Vercel
# (vercel-dns), and Vercel builds straight from this repo — that is what
# publishes the site. The GitHub Pages copy only ever 301'd to mathify.us.
#
# Since the site moved to `output: 'hybrid'` (so /api/chat can run as a
# serverless function for the tutor chatbot), `astro build` emits
# .vercel/output/ rather than a self-contained dist/, which Pages cannot host.
# Left here, runnable by hand, purely so the history and the Pages environment
# are not deleted out from under anyone. Do not re-enable the push trigger
# without first moving back to `output: 'static'`.
name: Deploy to GitHub Pages (disabled — Vercel is the live host)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vercel/output/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
